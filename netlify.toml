[build]
  publish = "public"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "https://jevbrain-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-keys"
  to = "/api-keys.html"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/roadmap"
  to = "/roadmap.html"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/rules"
  to = "/rules.html"
  status = 200

[[redirects]]
  from = "/burning-day"
  to = "/burning-day.html"
  status = 200

[[redirects]]
  from = "/teaser"
  to = "/teaser.html"
  status = 200

[[redirects]]
  from = "/cinematic"
  to = "/cinematic.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

